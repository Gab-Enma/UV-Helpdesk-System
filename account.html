<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ticketing System - Account</title>
    <link rel="stylesheet" href="styles/common.css" />
    <link rel="stylesheet" href="styles/account.css" />
  </head>
  <body>
    <!-- Sidebar Navigation -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar__brand">Ticketing System</div>
      <nav class="sidebar__nav">
        <a href="dashboard.html" class="sidebar__link">Dashboard</a>
        <a href="write.html" class="sidebar__link">Write</a>
        <a href="account.html" class="sidebar__link sidebar__link--active"
          >Account</a
        >
        <a href="login.html" class="sidebar__link sidebar__link--cta"
          >Login / Signup</a
        >
      </nav>
    </aside>

    <!-- Sidebar Toggle Button -->
    <button
      class="sidebar__toggle"
      id="sidebar-toggle"
      aria-label="Toggle sidebar"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M15 19l-7-7 7-7"
        />
      </svg>
    </button>

    <!-- Top Navigation -->
    <header class="topbar">
      <div class="brand">Ticketing System</div>
      <nav class="nav">
        <a href="dashboard.html" class="nav__link">Dashboard</a>
        <a href="write.html" class="nav__link">Write</a>
        <a href="account.html" class="nav__link nav__link--active">Account</a>
        <a href="login.html" class="nav__link nav__link--cta">Login / Signup</a>
      </nav>
    </header>

    <main class="page page--account page--with-sidebar">
      <section class="panel">
        <h1>My Account</h1>
        <p>Update your personal details and change your password.</p>
        <p>Display username: <strong id="display-username"></strong></p>

        <form class="account-form" action="#" method="post">
          <label>
            Full Name
            <input
              type="text"
              name="name"
              placeholder="Your full name"
              required
            />
          </label>

          <label>
            Email
            <input
              type="email"
              name="email"
              placeholder="you@example.com"
              required
            />
          </label>

          <fieldset class="password-fieldset">
            <legend>Change Password</legend>

            <label>
              Current Password
              <div
                style="position: relative; display: flex; align-items: center"
              >
                <input type="password" name="currentPassword" />
                <button
                  type="button"
                  class="toggle-password"
                  style="
                    position: absolute;
                    right: 8px;
                    background: none;
                    border: none;
                    cursor: pointer;
                    color: var(--primary);
                    font-weight: bold;
                  "
                >
                  Show
                </button>
              </div>
            </label>

            <label>
              New Password
              <div
                style="position: relative; display: flex; align-items: center"
              >
                <input type="password" name="newPassword" />
                <button
                  type="button"
                  class="toggle-password"
                  style="
                    position: absolute;
                    right: 8px;
                    background: none;
                    border: none;
                    cursor: pointer;
                    color: var(--primary);
                    font-weight: bold;
                  "
                >
                  Show
                </button>
              </div>
            </label>

            <label>
              Confirm New Password
              <div
                style="position: relative; display: flex; align-items: center"
              >
                <input type="password" name="confirmPassword" />
                <button
                  type="button"
                  class="toggle-password"
                  style="
                    position: absolute;
                    right: 8px;
                    background: none;
                    border: none;
                    cursor: pointer;
                    color: var(--primary);
                    font-weight: bold;
                  "
                >
                  Show
                </button>
              </div>
            </label>
          </fieldset>

          <div class="form-actions">
            <button id="update-account-btn" type="submit" class="button">
              Update Account
            </button>
            <a href="dashboard.html" class="button button--secondary"
              >Back to Dashboard</a
            >
          </div>
        </form>
      </section>
    </main>

    <footer class="footer">
      <p>&copy; <span id="year"></span> Ticketing System</p>
    </footer>

    <script src="account.js"></script>
    <script src="auth.js"></script>
  </body>
</html>
